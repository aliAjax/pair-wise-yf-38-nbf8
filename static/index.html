<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因组数据访问治理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 900px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .45rem .8rem; cursor: pointer; }
    input, select, textarea { padding: .4rem; margin: .2rem 0; width: 100%; box-sizing: border-box; }
    label { font-size: .85rem; color: #374151; display: block; margin-top: .5rem; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    section { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.2rem; margin: 1.2rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: .45rem .4rem; vertical-align: top; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; }
    .pending { background: #fef3c7; }
    .active { background: #dcfce7; }
    .expired { background: #e5e7eb; }
    .reviewed { background: #dbeafe; }
    .revoked { background: #fee2e2; }
    .rejected { background: #f3e8ff; }
    #result { min-height: 3rem; }
  </style>
</head>
<body>
<main>
  <h1>基因组数据访问治理</h1>
  <section>
    <h2>请求身份</h2>
    <div class="row">
      <div>
        <label>用户 ID</label>
        <input id="userId" value="alice">
      </div>
      <div>
        <label>角色</label>
        <select id="role">
          <option value="applicant">applicant（申请人）</option>
          <option value="committee">committee（委员会）</option>
          <option value="auditor">auditor（审计员）</option>
          <option value="admin">admin</option>
          <option value="viewer">viewer</option>
        </select>
      </div>
      <div style="flex:0">
        <button onclick="checkHealth()">检查服务状态</button>
      </div>
    </div>
    <pre id="result">等待操作</pre>
  </section>

  <section>
    <h2>发起紧急访问单</h2>
    <div class="row">
      <div><label>数据集 ID</label><input id="fDataset" placeholder="dataset 实体 ID，或用右侧按钮新建"></div>
      <div style="flex:0"><label>&nbsp;</label><button onclick="createDataset()">新建受控数据集</button></div>
    </div>
    <div class="row">
      <div><label>事故编号</label><input id="fIncident" placeholder="INC-2026-001"></div>
      <div><label>截止时间</label><input id="fExpires" type="datetime-local"></div>
    </div>
    <label>用途</label>
    <textarea id="fPurpose" rows="2" placeholder="事故排查需要访问的数据范围与用途"></textarea>
    <label id="remediationLabel" style="display:none">补说明（该数据集曾被认定越权，必填）</label>
    <textarea id="fRemediation" rows="2" style="display:none"></textarea>
    <p><button onclick="createEmergency()">提交紧急访问单</button></p>
  </section>

  <section>
    <h2>紧急访问单列表</h2>
    <p><button onclick="loadEmergencies()">刷新</button> <span id="clock"></span></p>
    <table>
      <thead>
        <tr><th>单据</th><th>事故 / 数据集</th><th>用途</th><th>状态</th><th>剩余时间</th><th>操作</th></tr>
      </thead>
      <tbody id="emergencyRows"><tr><td colspan="6">点击“刷新”加载</td></tr></tbody>
    </table>
  </section>

  <h2>接口说明</h2>
  <pre>GET  /health
GET  /api/emergency_access
POST /api/emergency_access
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions   {"action":"approve|reject|expire|review","data":{...}}</pre>
</main>
<script>
function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value
  };
}

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json();
  if (!response.ok) {
    throw new Error((payload.type || 'Error') + ': ' + payload.error);
  }
  return payload;
}

function show(value) {
  document.getElementById('result').textContent =
    typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}

async function checkHealth() {
  show(await fetch('/health').then(r => r.json()));
}

async function createDataset() {
  try {
    const ds = await api('/api/dataset', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ name: '事故受控数据集 ' + new Date().toISOString().slice(0, 16), access_policy: 'controlled' })
    });
    document.getElementById('fDataset').value = ds.id;
    show(ds);
  } catch (e) { show(String(e)); }
}

function defaultExpires() {
  const d = new Date(Date.now() + 4 * 3600 * 1000);
  d.setSeconds(0, 0);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
document.getElementById('fExpires').value = defaultExpires();

async function createEmergency() {
  const expiresLocal = document.getElementById('fExpires').value;
  if (!expiresLocal) { show('请选择截止时间'); return; }
  const body = {
    incident_id: document.getElementById('fIncident').value.trim(),
    dataset_id: document.getElementById('fDataset').value.trim(),
    purpose: document.getElementById('fPurpose').value.trim(),
    expires_at: expiresLocal + ':00'
  };
  const note = document.getElementById('fRemediation').value.trim();
  if (note) { body.remediation_note = note; }
  try {
    const ticket = await api('/api/emergency_access', {
      method: 'POST', headers: headers(), body: JSON.stringify(body)
    });
    show(ticket);
    loadEmergencies();
  } catch (e) { show(String(e)); }
}

const STATUS_LABEL = {
  pending: '待批准', active: '生效中', expired: '已失效待复核',
  reviewed: '复核通过', revoked: '越权撤销', rejected: '已拒绝'
};

function fmtRemaining(seconds) {
  if (seconds <= 0) return '已到期';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return h + '时' + String(m).padStart(2, '0') + '分' + String(s).padStart(2, '0') + '秒';
}

async function act(id, action, data) {
  try {
    show(await api('/api/entities/' + id + '/actions', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ action: action, data: data || {} })
    }));
    loadEmergencies();
  } catch (e) { show(String(e)); }
}

async function submitReview(id) {
  const finding = window.prompt("复核结论：输入 compliant（合规）或 unauthorized（越权）", "compliant");
  if (finding !== 'compliant' && finding !== 'unauthorized') { return; }
  const data = { finding: finding };
  if (finding === 'unauthorized') {
    const reason = window.prompt("请填写撤销原因", "");
    if (!reason) { show('认定越权必须填写原因'); return; }
    data.reason = reason;
  }
  await act(id, 'review', data);
}

async function rejectTicket(id) {
  const reason = window.prompt("拒绝原因", "");
  if (reason) { await act(id, 'reject', { reason: reason }); }
}

let currentTickets = [];

async function loadEmergencies() {
  try {
    const payload = await api('/api/emergency_access');
    currentTickets = payload.items || [];
    renderRows();
  } catch (e) { show(String(e)); }
}

function renderRows() {
  const body = document.getElementById('emergencyRows');
  if (!currentTickets.length) {
    body.innerHTML = '<tr><td colspan="6">暂无单据</td></tr>';
    return;
  }
  body.innerHTML = currentTickets.map(t => {
    const d = t.data || {};
    let actions = '';
    if (t.status === 'pending') {
      actions = '<button onclick="act(\'' + t.id + '\',\'approve\',{})">批准</button> '
        + '<button onclick="rejectTicket(\'' + t.id + '\')">拒绝</button>';
    } else if (t.status === 'expired') {
      actions = '<button onclick="submitReview(\'' + t.id + '\')">提交复核</button>';
    } else if (t.status === 'active') {
      actions = '<button onclick="act(\'' + t.id + '\',\'expire\',{})">手动置失效</button>';
    } else {
      actions = '—';
    }
    return '<tr>'
      + '<td>' + t.id.slice(0, 8) + '<br><small>' + (d.applicant_id || '') + '</small></td>'
      + '<td>' + (d.incident_id || '') + '<br><small>' + String(d.dataset_id || '').slice(0, 8) + '</small></td>'
      + '<td>' + (d.purpose || '') + (d.remediation_note ? '<br><small>补说明：' + d.remediation_note + '</small>' : '') + '</td>'
      + '<td><span class="badge ' + t.status + '">' + (STATUS_LABEL[t.status] || t.status) + '</span>'
        + (d.reason ? '<br><small>原因：' + d.reason + '</small>' : '') + '</td>'
      + '<td data-expires="' + (d.expires_at || '') + '" data-finished="' + (d.finished ? 1 : 0) + '">'
        + fmtRemaining(d.remaining_seconds || 0) + '</td>'
      + '<td>' + actions + '</td>'
      + '</tr>';
  }).join('');
}

// 每秒刷新页面上的剩余时间显示（权威状态以接口为准）。
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  document.querySelectorAll('#emergencyRows td[data-expires]').forEach(td => {
    if (td.dataset.finished === '1') { return; }
    const end = new Date(td.dataset.expires);
    const seconds = Math.max(0, Math.floor((end - new Date()) / 1000));
    td.textContent = fmtRemaining(seconds);
  });
}, 1000);
</script>
</body>
</html>
